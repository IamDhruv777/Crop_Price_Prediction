# ============================================================
# CROP PRICE PREDICTION — MAIN CONFIGURATION
# ============================================================

project:
  name: crop-price-prediction
  version: "1.0.0"
  description: "Region-wise Crop Price Prediction using Advanced AI/ML"
  timezone: Asia/Kolkata
  random_seed: 42

# ----------------------------------------------------------
# DATA SOURCES
# ----------------------------------------------------------
data_sources:
  mandi_prices:
    source_name: "AGMARKNET via data.gov.in"
    source_url: "https://api.data.gov.in/resource/"
    # Resource ID can be overridden via MANDI_RESOURCE_ID env variable
    resource_id: "9ef84268-d588-465a-a308-a864a43d0070"
    format: "json"
    date_field: "arrival_date"
    batch_size: 500

  weather:
    source_name: "NASA POWER Daily API"
    source_url: "https://power.larc.nasa.gov/api/temporal/daily/point"
    parameters:
      - T2M
      - T2M_MAX
      - T2M_MIN
      - PRECTOTCORR
      - RH2M
      - WS10M
    community: RE
    timeout_seconds: 60
    retry_attempts: 3
    retry_backoff: 2.0
    cache_days: 30  # cache weather data for 30 days

  crop_production:
    source_name: "data.gov.in Crop Production Statistics"
    source_url: "https://api.data.gov.in/resource/"
    resource_id: "ec1a3748-4181-4b3d-9b19-9e55d5b0a309"
    format: "json"

# ----------------------------------------------------------
# DEFAULT MVP REGION
# ----------------------------------------------------------
region:
  default_state: Maharashtra
  default_districts:
    - Nashik
    - Pune
    - Ahmednagar
    - Solapur
    - Aurangabad
    - Latur

# ----------------------------------------------------------
# CROPS
# ----------------------------------------------------------
crops:
  default:
    - Onion
    - Tomato
    - Soybean
  all_supported:
    - Onion
    - Tomato
    - Soybean
    - Potato
    - Wheat
    - Rice
    - Maize
    - Cotton
    - Sugarcane
    - Arhar/Tur

# ----------------------------------------------------------
# FORECAST HORIZONS
# ----------------------------------------------------------
forecast:
  horizons:
    - 1
    - 7
    - 30
  default_horizon: 7
  confidence_level: 0.95

# ----------------------------------------------------------
# DATA SPLITS (CHRONOLOGICAL)
# ----------------------------------------------------------
data_split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  minimum_training_days: 365

# ----------------------------------------------------------
# WALK-FORWARD VALIDATION
# ----------------------------------------------------------
walk_forward:
  method: expanding_window
  n_folds: 5
  min_train_days: 180
  step_days: 30

# ----------------------------------------------------------
# SPATIAL SETTINGS
# ----------------------------------------------------------
spatial:
  k_neighbors: 5
  max_distance_km: 200
  distance_metric: haversine
  edge_weight_sigma: 50.0  # km
  min_markets_for_graph: 3

# ----------------------------------------------------------
# OUTLIER DETECTION
# ----------------------------------------------------------
outlier_detection:
  iqr_multiplier: 3.0
  mad_threshold: 3.5
  rolling_zscore_window: 30
  rolling_zscore_threshold: 3.0

# ----------------------------------------------------------
# MISSING VALUE THRESHOLDS
# ----------------------------------------------------------
missing_values:
  max_price_gap_days: 14      # max gap to interpolate price
  max_weather_gap_days: 7     # max gap to interpolate weather
  flag_threshold_pct: 20.0   # flag series with >20% missing

# ----------------------------------------------------------
# FEATURE WINDOWS
# ----------------------------------------------------------
features:
  price_lags: [1, 7, 14, 30]
  rolling_windows: [7, 14, 30]
  arrival_lags: [1, 7, 30]
  weather_lags: [1, 7, 14]

# ----------------------------------------------------------
# PRICE ALERT THRESHOLDS
# ----------------------------------------------------------
alerts:
  price_spike_std_multiplier: 2.0
  price_drop_std_multiplier: 2.0
  high_volatility_threshold: 0.15   # 15% CV
  forecast_uncertainty_threshold: 0.20  # 20% relative interval width
  model_degradation_threshold: 0.30  # 30% increase in RMSE vs baseline

# ----------------------------------------------------------
# DATABASE
# ----------------------------------------------------------
database:
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 3600
  echo: false

# ----------------------------------------------------------
# API
# ----------------------------------------------------------
api:
  title: "Crop Price Prediction API"
  version: "v1"
  prefix: "/api/v1"
  cors_origins:
    - "http://localhost:8501"
    - "http://localhost:3000"

# ----------------------------------------------------------
# PATHS
# ----------------------------------------------------------
paths:
  data_raw: "./data/raw"
  data_interim: "./data/interim"
  data_processed: "./data/processed"
  data_features: "./data/features"
  models: "./models"
  logs: "./logs"
  reports: "./reports"
  notebooks: "./notebooks"

# ----------------------------------------------------------
# LOGGING
# ----------------------------------------------------------
logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  file: "./logs/app.log"
  max_bytes: 10485760  # 10 MB
  backup_count: 5
